<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>GREYGALAXY</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;width:100vw;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card{
  position:relative;
  width:400px;
  height:560px;
  max-width:100vw;
  max-height:100vh;
}
.card a{display:block;width:100%;height:100%}
.card img{display:block;width:100%;height:100%;object-fit:contain;cursor:pointer}
.overlay{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:10;
  transform:translateY(-50px);
}
.overlay span{
  font-family:'Press Start 2P',monospace;
  font-size:28px;
  color:#ffffff;
  text-align:center;
  text-shadow:
    0 0 10px #ffffff,
    0 0 30px #ffffff,
    0 0 60px #ffffff,
    0 0 100px #ffffff;
  animation:flash 3s infinite;
  line-height:1.6;
}
@keyframes flash{
  0%{opacity:1;text-shadow:0 0 10px #ffffff,0 0 30px #ffffff,0 0 60px #ffffff,0 0 100px #ffffff}
  50%{opacity:1;text-shadow:0 0 10px #ffffff,0 0 30px #ffffff,0 0 60px #ffffff,0 0 100px #ffffff}
  60%{opacity:0}
  100%{opacity:0}
}
</style>
</head>
<body>
<div class="card">
<a href="https://ordinals.com/content/38e2a75ea34d8e5fe53f69bd34804562b0388111dd8542236b6008c335d8ce57i0" target="_blank" rel="noopener">

</div>
